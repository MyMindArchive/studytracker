# Builds installers for macOS (universal) and Windows and attaches them to a
# draft GitHub release. Trigger: push a tag like v1.0.0, or run it manually.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: --bundles nsis
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - if: runner.os == 'macOS'
        run: echo "CI=true" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'manual' }}
          releaseName: StudyTracker ${{ github.ref_type == 'tag' && github.ref_name || 'manual build' }}
          releaseDraft: true
          args: ${{ matrix.args }}
